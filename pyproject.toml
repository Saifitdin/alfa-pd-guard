[project]
name = "pdguard"
version = "1.0.0"
description = "Модуль безопасности персональных данных: прокси между системой-потребителем и LLM"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
